```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Storage - History</title>

    <link
        rel="stylesheet"
        href="history.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="header-left">

            <h1>
                Smart Storage Monitoring System
            </h1>

            <p>
                Data History
            </p>

        </div>


        <div class="header-right">

            <span
                id="connectionStatus"
                class="status offline"
            >
                ● ESP32 Offline
            </span>


            <button
                id="backButton"
                class="back-button"
            >
                Back
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="container">


        <!-- =================================================
             TITLE
             ================================================= -->

        <section class="page-title">

            <h2>
                History Records
            </h2>

            <p>
                Latest records are displayed first.
            </p>

        </section>



        <!-- =================================================
             CONTROLS
             ================================================= -->

        <section class="controls">


            <input
                type="text"
                id="historySearch"
                placeholder="Search date, time, float, integer, or string..."
                autocomplete="off"
            >


            <button
                type="button"
                id="refreshButton"
                class="button refresh"
            >
                Refresh
            </button>


            <button
                type="button"
                id="clearButton"
                class="button clear"
            >
                Clear History
            </button>

        </section>



        <!-- =================================================
             STATUS CARDS
             ================================================= -->

        <section class="info-cards">


            <div class="info-card">

                <span>
                    Collection Status
                </span>

                <strong
                    id="collectionStatus"
                    class="stopped"
                >
                    STOPPED
                </strong>

            </div>



            <div class="info-card">

                <span>
                    Total Records
                </span>

                <strong
                    id="recordCount"
                >
                    0
                </strong>

            </div>



            <div class="info-card">

                <span>
                    Current Seconds
                </span>

                <strong
                    id="secondsCount"
                >
                    0
                </strong>

            </div>

        </section>



        <!-- =================================================
             HISTORY MESSAGE
             ================================================= -->

        <div
            id="historyMessage"
            class="history-message"
        >
            Loading history...
        </div>



        <!-- =================================================
             HISTORY TABLE
             ================================================= -->

        <section class="table-container">

            <table
                id="historyTable"
            >


                <thead>

                    <tr>

                        <th>
                            DATE
                        </th>

                        <th>
                            TIME
                        </th>

                        <th>
                            FLOAT
                        </th>

                        <th>
                            INTEGER
                        </th>

                        <th>
                            STRING
                        </th>

                    </tr>

                </thead>



                <tbody
                    id="historyBody"
                >

                    <!--
                        JavaScript will automatically
                        insert history records here.
                    -->

                </tbody>


            </table>

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="history.js"></script>


</body>

</html>
```
