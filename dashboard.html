```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Storage Monitoring System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            max-width: 900px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
        }

        #motionValue {
            color: #333;
        }

        #temperatureValue {
            color: #e67e22;
        }

        #statusValue {
            color: #27ae60;
        }
    </style>
</head>

<body>

    <h1>SMART STORAGE MONITORING SYSTEM</h1>

    <div class="dashboard">

        <!-- INT -->
        <div class="card">
            <h2>Motion</h2>
            <div class="value" id="motionValue">0</div>
        </div>

        <!-- FLOAT -->
        <div class="card">
            <h2>Temperature</h2>
            <div class="value">
                <span id="temperatureValue">0.00</span> °C
            </div>
        </div>

        <!-- STRING -->
        <div class="card">
            <h2>Status</h2>
            <div class="value" id="statusValue">Normal</div>
        </div>

    </div>

    <script type="module">

        // Firebase SDK
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


        // ==================================================
        // FIREBASE CONFIG
        // ==================================================

        const firebaseConfig = {

            apiKey: "YOUR_API_KEY",

            authDomain: "YOUR_PROJECT.firebaseapp.com",

            databaseURL: "YOUR_DATABASE_URL",

            projectId: "YOUR_PROJECT_ID",

            storageBucket: "YOUR_PROJECT.firebasestorage.app",

            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

            appId: "YOUR_APP_ID"

        };


        // ==================================================
        // INITIALIZE FIREBASE
        // ==================================================

        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);


        // ==================================================
        // FIREBASE PATH
        // ==================================================

        const sensorRef = ref(database, "sensor");


        // ==================================================
        // READ DATA
        // ==================================================

        onValue(sensorRef, (snapshot) => {

            const data = snapshot.val();

            if (!data) {
                return;
            }


            // INT
            if (data.motion !== undefined) {

                document.getElementById("motionValue").textContent =
                    data.motion;

            }


            // FLOAT
            if (data.temperature !== undefined) {

                document.getElementById("temperatureValue").textContent =
                    Number(data.temperature).toFixed(2);

            }


            // STRING
            if (data.status !== undefined) {

                document.getElementById("statusValue").textContent =
                    data.status;

            }

        });

    </script>

</body>
</html>
