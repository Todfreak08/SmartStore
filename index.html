<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Storage Monitoring System</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-header">

        <div class="logo-group">

            <img src="pcc.jpg" alt="PCC Logo">
            <img src="bsit.jpeg" alt="BSIT Logo">

        </div>

        <h2>SMART STORAGE MONITORING SYSTEM</h2>

        <p>IoT Environmental Monitoring and Data Logging</p>

    </div>

    <div class="input-group">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email">

    </div>

    <div class="input-group">

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password">

    </div>

    <button
        class="login-btn"
        onclick="login()">

        LOGIN

    </button>

    <p
        id="message"
        style="margin-top:15px;text-align:center;color:red;">
    </p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="login.js"></script>

</body>
</html>
